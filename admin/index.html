<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex">
  <title>예수로교회 홈페이지 관리</title>
  <style>
    /* 미리보기에서 누른 부분에 해당하는 입력칸을 잠시 표시한다 */
    .jr-hit{outline:3px solid #e5a13a !important;outline-offset:2px;
      border-radius:2px;transition:outline-color .3s}

    /* 관리자 첫 화면 = 홈페이지 전체 보기 */
    #jrHome{position:fixed;inset:0;z-index:9000;display:none;flex-direction:column;
      background:#eceadf;font-family:-apple-system,BlinkMacSystemFont,
      "Apple SD Gothic Neo","Malgun Gothic",sans-serif}
    #jrHome.on{display:flex}
    #jrHome .hd{flex:none;display:flex;align-items:center;gap:12px;padding:11px 16px;
      background:#172532;color:#f4f1ea;font-size:14px;line-height:1.4}
    #jrHome .hd b{color:#e5c07b;font-weight:700;font-size:15px}
    #jrHome .hd .sp{flex:1}
    #jrHome .hd button{padding:7px 13px;border:1px solid rgba(255,255,255,.45);
      background:transparent;color:#fff;font-size:13px;font-weight:600;cursor:pointer}
    #jrHome .hd button:hover{background:rgba(255,255,255,.14)}
    #jrHome .tipline{flex:none;padding:8px 16px;background:#fdf6e6;color:#7a5f2a;
      font-size:13px;line-height:1.6}
    #jrHome .tipline em{font-style:normal;font-weight:700;color:#8a5a12}
    #jrHome iframe{flex:1;width:100%;border:0;background:#fff}
    body.jr-home-on{overflow:hidden}
  </style>
</head>
<body>
  <script src="https://unpkg.com/decap-cms@^3.8.4/dist/decap-cms.js"></script>
  <script>
  /* ─────────────────────────────────────────────────────────────
     관리자 화면 오른쪽에 실제 홈페이지를 띄워, 지금 고치는 항목이
     화면의 어느 부분인지 바로 보이게 한다. 입력하는 즉시 반영된다.
     ───────────────────────────────────────────────────────────── */
  (function () {
    if (!window.CMS) { console.warn('Decap CMS 를 불러오지 못했습니다.'); return; }

    /* 미리보기 컴포넌트는 Decap 이 만든 iframe 안에서 실행된다.
       그 안에서 document 를 쓰면 관리자 화면이 아니라 iframe 문서를 가리키므로,
       스크립트가 읽히는 지금(=관리자 화면) 의 document 를 붙잡아 둔다. */
    var ADOC = document;

    /* 미리보기 창은 별도의 iframe 이라 이 페이지의 <style> 이 닿지 않는다.
       registerPreviewStyle 로 그 안에 직접 넣어 준다. */
    CMS.registerPreviewStyle(`
      html,body{margin:0;padding:0;height:100%;overflow:hidden}
      .jr-preview{position:fixed;inset:0;display:flex;flex-direction:column;background:#eceadf;
        font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic",sans-serif}
      .jr-bar{flex:none;display:flex;gap:10px;align-items:center;padding:9px 12px;
        background:#172532;color:#f4f1ea;font-size:13px;line-height:1.4}
      .jr-bar b{color:#e5c07b;font-weight:700}
      .jr-bar .sp{flex:1}
      .jr-bar select,.jr-bar button{padding:5px 9px;border:1px solid rgba(255,255,255,.42);
        background:transparent;color:#fff;font-size:12px;font-weight:600;cursor:pointer}
      .jr-bar button.on{background:#e5c07b;border-color:#e5c07b;color:#17110a}
      .jr-hint{flex:none;padding:7px 12px;background:#fdf6e6;color:#7a5f2a;font-size:12px;line-height:1.5}
      .jr-stage{flex:1;min-height:0;display:flex;justify-content:center;background:#dcd8cc;overflow:auto}
      .jr-stage iframe{width:100%;height:100%;border:0;background:#fff;box-shadow:0 0 0 1px rgba(0,0,0,.08)}
      .jr-stage.narrow iframe{width:390px;flex:none}
    `, { raw: true });

    /* ── 관리자 첫 화면: 홈페이지를 그대로 띄우고, 고칠 곳을 눌러 들어간다 ── */
    var pendingJump = null;          /* 편집 화면이 열리면 이 칸으로 이동한다 */
    var loadedCol = null;            /* 내용까지 실제로 불러온 관리 항목 */
    var homeEl = null, homeFrame = null;

    function buildHome() {
      if (homeEl) return homeEl;
      homeEl = ADOC.createElement('div');
      homeEl.id = 'jrHome';
      homeEl.innerHTML =
        '<div class="hd"><b>예수로교회 홈페이지 관리</b>' +
        '<span>고치고 싶은 곳을 화면에서 바로 고르세요</span>' +
        '<span class="sp"></span>' +
        '<button type="button" data-jr="list">항목 목록으로</button>' +
        '<button type="button" data-jr="reload">새로 불러오기</button></div>' +
        '<div class="tipline">화면에서 고치고 싶은 부분에 마우스를 올리면 ' +
        '<em>이 부분 고치기</em> 가 나타납니다. 누르면 그 자리를 고치는 칸이 열립니다.</div>' +
        '<iframe title="홈페이지" src="' + SITE_SRC + '"></iframe>';
      ADOC.body.appendChild(homeEl);
      homeFrame = homeEl.querySelector('iframe');
      homeEl.querySelector('[data-jr="list"]').addEventListener('click', function () {
        setView('cms');
      });
      homeEl.querySelector('[data-jr="reload"]').addEventListener('click', function () {
        homeFrame.src = SITE_ROOT + '?preview=1&t=' + Date.now();
      });
      return homeEl;
    }
    function showHome(on) {
      buildHome();
      homeEl.classList.toggle('on', on);
      ADOC.body.classList.toggle('jr-home-on', on);
      if (on && !homeFrame.src) homeFrame.src = SITE_SRC;
    }
    /* 로그인하면 Decap 이 첫 항목으로 알아서 넘어가므로 주소로는 판단할 수 없다.
       "지금 무엇을 보고 있는가" 를 직접 기억한다.
       관리자 화면을 열 때는 언제나 홈페이지 전체 보기부터 시작한다. */
    var viewState = 'home';
    function view() { return viewState; }
    function setView(v) { viewState = v; syncHome(); }
    function loggedIn() {
      return !!ADOC.querySelector('[class*="AppHeader"], [class*="SidebarContainer"]');
    }
    function syncHome() { showHome(view() === 'home' && loggedIn()); }
    window.addEventListener('hashchange', syncHome);
    setInterval(syncHome, 500);

    /* 홈페이지(전체 화면 또는 미리보기) 에서 "이 부분 고치기" 를 눌렀다 */
    window.addEventListener('message', function (e) {
      var m = e.data;
      if (!m || m.type !== 'jesusro-field' || !m.col) return;
      pendingJump = { col: m.col, path: m.path, at: Date.now() };
      /* 편집 창을 바로 갈아끼우면 Decap 이 이전 입력칸을 남긴다.
         목록 화면을 한 번 거쳐 이전 편집 창을 내린 뒤 들어간다. */
      var want = '#/collections/' + m.col + '/entries/' + m.col;
      location.hash = '#/collections/' + m.col;
      setTimeout(function () { location.hash = want; }, 500);
      setView('cms');
    });

    /* 컬렉션 → 홈페이지에서 열어 볼 화면 */
    var PAGES = {
      site: 'home', menu: 'home', quicklinks: 'home', ministry: 'home',
      calendar: 'home', applications: 'home',
      sermons: 'sermon', praise: 'praise', bulletins: 'bulletin',
      notices: 'board', gallery: 'gallery', departments: 'dept',
      staff: 'staff', cafe: 'cafe', worship: 'worship',
      smallgroup: 'smallgroup', mission: 'mission', newfamily: 'family',
      visit: 'visit', facility: 'facility'
    };
    /* 부서처럼 다른 화면도 같이 보면 좋은 경우 */
    var EXTRA_PAGES = {
      departments: [['dept', '부서 카드 목록'], ['dept-kids', '유치부'], ['dept-elementry', '초등부'],
                    ['dept-youth', '청소년부'], ['dept-young', '청년부'], ['dept-men', '장년부']],
      site: [['home', '첫 화면'], ['visit', '오시는 길'], ['worship', '예배 안내']],
      sermons: [['sermon', '설교 아카이브'], ['home', '첫 화면 설교 영상']],
      applications: [['home', '첫 화면 신청 카드'], ['dept-youth', '청소년부'], ['dept-young', '청년부']]
    };
    var SITE_ROOT = '../index.html';
    /* 항목을 옮겨 다닐 때마다 홈페이지를 다시 받지 않도록 주소를 한 번만 정한다 */
    var SITE_SRC = SITE_ROOT + '?preview=1&t=' + Date.now();

    /* 컬렉션을 바꿔도 같은 컴포넌트가 재사용되므로,
       항목 이름은 props 에서 그때그때 읽는다. */
    var PreviewPane = window.createClass({
      getInitialState: function () { return { page: null, name: null }; },
      cur: function () {
        try { return this.props.collection.get('name'); } catch (e) { return null; }
      },
      page: function () {
        var n = this.cur();
        if (this.state.name === n && this.state.page) return this.state.page;
        return PAGES[n] || 'home';
      },
      componentDidMount: function () {
        var self = this;
        /* 홈페이지 쪽 준비가 끝났다는 신호를 받은 뒤에 보낸다.
           iframe 의 load 시점은 아직 content/*.json 을 읽기 전이라 무시된다. */
        this.onReady = function (e) {
          var m = e.data; if (!m) return;
          if (m.type === 'jesusro-preview-ready') { self.ready = true; self.push(); return; }
          /* 미리보기에서 어떤 부분을 눌렀다 -> 왼쪽에서 그 입력칸을 열고 커서를 놓는다.
             다른 관리 항목의 자리를 눌렀다면 셸이 화면을 옮겨 주므로 여기선 손대지 않는다. */
          if (m.type === 'jesusro-field' && m.path && m.col === self.cur()) self.jumpTo(m.path);
        };
        window.addEventListener('message', this.onReady);
        /* 전체 화면에서 고른 자리가 있으면 그 칸으로 데려간다 */
        /* 새로 불러온 뒤 남겨 둔 목적지를 집어 든다 */
        if (!pendingJump) {
          try {
            var saved = sessionStorage.getItem('jrPending');
            if (saved) { pendingJump = JSON.parse(saved); sessionStorage.removeItem('jrPending'); }
          } catch (e) {}
        }
        /* 항목을 옮기면 이 컴포넌트가 새로 만들어지는데, 홈페이지 iframe 은
           그대로라 준비 신호가 다시 오지 않는다. 준비될 때까지 물어본다. */
        this.pingTimer = setInterval(function () {
          if (self.ready) { clearInterval(self.pingTimer); return; }
          var f = self.frame;
          if (f && f.contentWindow) f.contentWindow.postMessage({ type: 'jesusro-ping' }, '*');
        }, 400);
        this.pendTimer = setInterval(function () {
          if (!pendingJump || !self.ready) return;
          /* 새 항목의 내용까지 실제로 들어온 뒤에 움직인다.
             그 전에 움직이면 아직 남아 있는 이전 편집 창을 짚는다. */
          if (pendingJump.col !== self.cur() || loadedCol !== pendingJump.col) return;
          if (self.jumping) return;
          /* 성공할 때까지 목적지를 지우지 않는다 */
          self.jumping = true;
          var j = pendingJump;
          setTimeout(function () {
            self.jumpTo(j.path, 8, function (ok) {
              self.jumping = false;
              if (ok && pendingJump === j) pendingJump = null;
            });
          }, 350);
        }, 250);
        /* 왼쪽에서 커서가 가거나 글자를 치면, 그 칸이 화면 어디인지 오른쪽에 알린다 */
        this.onEdit = function (e) {
          var el = e.target;
          if (!el || !/^(INPUT|TEXTAREA|SELECT)$/.test(el.tagName)) return;
          /* 왼쪽 편집 칸(Pane1) 의 입력만 본다.
             바깥 컨테이너 클래스에도 PreviewPaneContainer 가 들어 있어 그것으로는 못 거른다. */
          if (!el.closest('[class*="Pane1"]')) return;
          var path = self.pathOf(el);
          if (path) self.tell(self.cur(), path, el.value);
        };
        ADOC.addEventListener('focusin', this.onEdit, true);
        ADOC.addEventListener('input', this.onEdit, true);
        this.push();
      },
      componentWillUnmount: function () {
        clearInterval(this.pendTimer);
        clearInterval(this.pingTimer);
        window.removeEventListener('message', this.onReady);
        ADOC.removeEventListener('focusin', this.onEdit, true);
        ADOC.removeEventListener('input', this.onEdit, true);
      },
      /* 입력칸에서 거꾸로 필드 경로를 만든다.
         Decap 은 id="<필드이름>-field-<번호>" 를 붙이고, 목록 항목은
         SortableListItem 으로 감싼다. 위로 올라가며 이름과 순번을 모은다. */
      pathOf: function (el) {
        var parts = [], node = el;
        while (node && node !== ADOC.body) {
          if (node.id && /-field-\d+$/.test(node.id)) {
            parts.unshift(node.id.replace(/-field-\d+$/, ''));
          } else if (node.className && String(node.className).indexOf('SortableListItem') >= 0) {
            var sibs = node.parentElement
              ? [].slice.call(node.parentElement.children).filter(function (c) {
                  return String(c.className).indexOf('SortableListItem') >= 0;
                })
              : [];
            var idx = sibs.indexOf(node);
            if (idx >= 0) parts.unshift(String(idx));
          }
          node = node.parentElement;
        }
        return parts.length ? parts.join('.') : null;
      },
      tell: function (col, path, value) {
        var f = this.frame;
        if (!f || !f.contentWindow || !col) return;
        f.contentWindow.postMessage(
          { type: 'jesusro-focus', col: col, path: path,
            value: String(value == null ? '' : value) }, '*');
      },
      componentDidUpdate: function () { this.push(); },
      push: function () {
        var f = this.frame, n = this.cur();
        if (!f || !f.contentWindow || !this.ready || !n) return;
        var data;
        try { data = this.props.entry.get('data').toJS(); } catch (e) { return; }
        /* 항목을 막 바꾼 순간에는 내용이 비어 있다. 그대로 보내면 화면이 지워진다. */
        if (!data || !Object.keys(data).length) return;
        loadedCol = n;
        f.contentWindow.postMessage(
          { type: 'jesusro-preview', name: n, data: data, page: this.page() }, '*');
      },
      /* 미리보기에서 누른 곳(예: items.3.name)에 해당하는 입력칸을 찾아
         펼치고, 화면으로 끌어오고, 커서를 놓는다.
         Decap 은 컨트롤마다 id="<필드이름>-field-<번호>" 를 붙여 준다. */
      /* 왼쪽 편집 창 (미리보기 쪽 복제본이 아닌 진짜) */
      leftPane: function () {
        return ADOC.querySelector('[class*="Pane1"] [class*="ControlPaneContainer"]')
          || ADOC.querySelector('[class*="ControlPaneContainer"]');
      },
      /* 최상위 필드의 화면 이름표 (예: welcome -> "환영 문구") */
      labelOf: function (name) {
        try {
          var f = this.props.fields.toJS().filter(function (x) { return x.name === name; })[0];
          return f && f.label;
        } catch (e) { return null; }
      },
      /* 이 항목의 최상위 필드 이름들 (예: quicklinks -> headerButton, items) */
      topNames: function () {
        try {
          return this.props.fields.toJS().map(function (f) { return f.name; });
        } catch (e) { return []; }
      },
      /* 왼쪽 창이 "지금 이 항목" 의 것인지 확인한다.
         항목을 바꾼 직후에는 이전 항목의 입력칸이 남아 있어서,
         이름이 겹치는 필드(items 등) 를 잘못 짚게 된다. */
      paneIsMine: function () {
        var p = this.leftPane();
        if (!p) return false;
        var names = this.topNames();
        if (!names.length) return true;
        /* 화면에 나오지 않는 필드도 있으므로 "하나라도 있으면" 으로 본다 */
        return names.some(function (n) {
          return !!p.querySelector('[id^="' + n + '-field-"]');
        });
      },
      /* 창이 이 항목 것이 되고, 더 이상 다시 그려지지 않을 때까지 기다린다 */
      whenSettled: function (done) {
        var self = this, last = null, same = 0, tries = 0;
        var t = setInterval(function () {
          var p = self.leftPane();
          var mine = self.paneIsMine();
          var sig = (p && mine)
            ? [].slice.call(p.querySelectorAll('[id*="-field-"]')).map(function (e) { return e.id; }).join(',')
            : '';
          if (sig && sig === last) same++; else { same = 0; last = sig; }
          if (same >= 3 || ++tries > 30) { clearInterval(t); done(); }
        }, 180);
      },
      jumpTo: function (path, tries, done) {
        var self = this;
        var finishOnce = function (ok) { if (done) { var d = done; done = null; d(ok); } };
        var seek = function (left) {
          /* 1) Decap 에게 먼저 알린다 — 접혀 있는 목록 항목이 펼쳐진다 */
          try { self.props.onFieldClick && self.props.onFieldClick(path); } catch (e) {}
          /* 2) 펼쳐질 시간을 준 뒤 실제 입력칸을 짚고, 제대로 갔는지 확인한다 */
          setTimeout(function () {
            self.point(path);
            setTimeout(function () {
              var a = ADOC.activeElement;
              var seg = String(path).split('.').pop();
              var named = !/^\d+$/.test(seg);
              var ok = a && /^(INPUT|TEXTAREA|SELECT)$/.test(a.tagName)
                && (!named || a.id.indexOf(seg + '-field-') === 0);
              /* 아직 이 항목의 입력칸이 다 그려지지 않았을 수 있다.
                 다시 안정될 때까지 기다렸다가 시도한다. */
              if (ok) return finishOnce(true);
              if (left > 0) return self.whenSettled(function () { seek(left - 1); });
              finishOnce(false);
            }, 500);
          }, 380);
        };
        this.whenSettled(function () { seek(tries == null ? 8 : tries); });
      },
      point: function (path) {
        var self = this, parts = String(path).split('.'), i = 0, scope = null, target = null;

        function pane() { return self.leftPane() || ADOC.body; }
        /* 이 범위에서 "가장 바깥쪽" 목록 항목들만 고른다.
           안쪽에 또 목록이 있어도 순번이 어긋나지 않는다. */
        function rows(el) {
          var direct = el.querySelectorAll(':scope > div > [class*="SortableListItem"]');
          if (direct.length) return direct;
          var all = [].slice.call(el.querySelectorAll('[class*="SortableListItem"]'));
          return all.filter(function (x) {
            return !all.some(function (y) { return y !== x && y.contains(x); });
          });
        }
        function step() {
          if (!scope) scope = pane();
          if (i >= parts.length) return finish();
          var part = parts[i++];

          if (/^\d+$/.test(part)) {
            var rs = rows(scope);
            if (!rs.length) {
              /* 목록 전체가 접혀 있으면 항목이 그려지지 않는다. 펼치고 다시 본다. */
              step.waited = (step.waited || 0) + 1;
              if (step.waited <= 4) {
                var toggle = scope.querySelector('[class*="TopBarContainer"] button');
                if (toggle) { try { toggle.click(); } catch (e) {} }
                i--;
                return setTimeout(step, 420);
              }
              return finish();
            }
            var row = rs[Number(part)];
            if (!row) return finish();
            scope = row; target = row;
            if (!row.querySelector('[id*="-field-"]')) {
              /* 접혀 있다 — 펼치고 다시 그려질 때까지 기다린다 */
              var head = row.querySelector('button, [role="button"]');
              if (head) { try { head.click(); } catch (e) {} }
              return setTimeout(step, 320);
            }
            return step();
          }

          /* 항목을 바꾼 직후에는 이전 항목의 같은 이름 입력칸이 남아 있다.
             Decap 은 번호를 계속 늘려 붙이므로 가장 큰 번호(=가장 나중에 그려진 것)를 쓴다.
             맨 처음 조각은 목록 항목 안쪽 필드와 헷갈리지 않게 바깥 것만 본다. */
          var cand = [].slice.call(scope.querySelectorAll('[id^="' + part + '-field-"]'));
          if (i === 1) {
            var outer = cand.filter(function (e) {
              return !e.closest('[class*="SortableListItem"]');
            });
            if (outer.length) cand = outer;
          }
          if (!cand.length) {
            /* 여러 칸을 묶은 항목(object) 이나 목록에는 id 가 붙지 않는다.
               화면에 보이는 이름표로 그 묶음을 찾는다. */
            var lab = self.labelOf(part);
            if (lab && i === 1) {
              var labels = [].slice.call(scope.querySelectorAll('label'));
              for (var k = 0; k < labels.length; k++) {
                if (labels[k].textContent.trim() === lab) {
                  /* 이름표는 위젯 위쪽 막대 안에 있다. 위젯 본체까지 올라간다. */
                  scope = labels[k].closest('[class*="ControlContainer"]')
                    || labels[k].parentElement || scope;
                  target = scope;
                  return step();
                }
              }
            }
            /* 그래도 못 찾으면 범위를 그대로 두고 다음 단계로 넘어간다 */
            if (i < parts.length) return step();
            return finish();
          }
          var el = cand[0], best = -1;
          cand.forEach(function (e) {
            var n = Number(String(e.id).replace(/^.*-field-/, '')) || 0;
            if (n > best) { best = n; el = e; }
          });
          scope = el; target = el;
          return step();
        }
        function finish() {
          if (!target) return false;
          var input = /^(INPUT|TEXTAREA|SELECT)$/.test(target.tagName)
            ? target : target.querySelector('input, textarea, select');
          var show = input || target;
          try { show.scrollIntoView({ block: 'center', behavior: 'smooth' }); } catch (e) {}
          if (input) { try { input.focus(); } catch (e) {} }
          show.classList.add('jr-hit');
          setTimeout(function () { show.classList.remove('jr-hit'); }, 2400);
        }
        step();
      },
      render: function () {
        var self = this, n = this.cur(), extra = EXTRA_PAGES[n];
        return window.h('div', { className: 'jr-preview' },
          window.h('div', { className: 'jr-bar' },
            window.h('b', null, '실제 홈페이지'),
            window.h('span', null, '왼쪽에서 고치면 여기에 바로 나타납니다'),
            window.h('span', { className: 'sp' }),
            extra ? window.h('select', {
              value: self.page(),
              onChange: function (e) { self.setState({ page: e.target.value, name: n }); }
            }, extra.map(function (p) {
              return window.h('option', { key: p[0], value: p[0] }, p[1]);
            })) : null,
            window.h('button', {
              className: self.state.narrow ? 'on' : '',
              onClick: function () { self.setState({ narrow: !self.state.narrow }); }
            }, self.state.narrow ? '휴대폰 폭' : 'PC 폭'),
            window.h('button', {
              onClick: function () { setView('home'); }
            }, '전체 화면으로')
          ),
          window.h('div', { className: 'jr-hint' },
            '미리 보기입니다. 실제 홈페이지에 반영하려면 위의 “게시” 를 눌러 주세요.'),
          window.h('div', { className: 'jr-stage' + (self.state.narrow ? ' narrow' : '') },
            window.h('iframe', {
              title: '홈페이지 미리보기',
              src: SITE_SRC,
              ref: function (el) { self.frame = el; },
              onLoad: function () { self.ready = false; }
            })
          )
        );
      }
    });

    Object.keys(PAGES).forEach(function (name) {
      try { CMS.registerPreviewTemplate(name, PreviewPane); }
      catch (e) { console.warn('미리보기 등록 실패:', name, e); }
    });

  })();
  </script>
</body>
</html>
